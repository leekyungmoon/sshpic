name: Platform support request
description: Request or report verification for a terminal/platform
labels: [platform]
body:
  - type: input
    id: platform
    attributes:
      label: Platform and terminal
      placeholder: macOS Terminal.app, Linux Kitty, Windows WSL, etc.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or desired workflow
      description: Include commands and behavior. Do not include sensitive screenshots.
    validations:
      required: true
